plugins {
  id 'com.android.application'
}

android {
  namespace 'com.moon.mediavision.demo'
  compileSdk 35
  buildToolsVersion '35.0.0'
  ndkVersion '27.0.12077973'
  buildFeatures {
    buildConfig true
  }
  androidResources {
    noCompress 'mvsmodels'
  }
  // AGP 8.5.2 aligns uncompressed native libraries to 16 KB in APKs/bundles.
  packagingOptions {
    jniLibs {
      useLegacyPackaging false
    }
  }
  defaultConfig {
    applicationId 'com.moon.mediavision.demo'
    minSdk 26
    targetSdk 35
    versionCode 4
    versionName '0.4.0'
    ndk {
      abiFilters(*(project.findProperty('mvsAbis')
          ?: 'arm64-v8a,armeabi-v7a,x86').split(','))
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'com.github.qmy1990:MediaVision:0.4.1'
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
  implementation 'androidx.activity:activity:1.9.2'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
